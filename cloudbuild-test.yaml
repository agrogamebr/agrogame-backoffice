steps:
  # 1. Instala as dependências do projeto
  - name: "node:20"
    entrypoint: "npm"
    args: ["install"]
    id: "Install Dependencies"

  # 2. Roda o build de produção para garantir que a aplicação compila
  - name: "node:20"
    entrypoint: "npm"
    args: ["run", "build"]
    id: "Build Application"
    env:
      - "NEXT_PUBLIC_ENVIRONMENT=CI_TEST"
      - 'NEXT_PUBLIC_API_URL=https://ci-placeholder.agribit.com.br'
      - 'NEXT_PUBLIC_APP_NAME=AgroGame CI'

# A seção 'options' para garantir que os logs funcionem com a conta de serviço
options:
  logging: CLOUD_LOGGING_ONLY